<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Symbion</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111315;
      --surface: #171b1f;
      --surface-2: #1e242a;
      --line: #2b333c;
      --text: #f3f6f8;
      --muted: #9ea9b3;
      --accent: #65d6ad;
      --warn: #e8c26a;
      --user: #243a35;
      --assistant: #20262d;
    }
    * { box-sizing: border-box; }
    html,
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, sans-serif;
      letter-spacing: 0;
    }
    main {
      display: grid;
      grid-template-rows: 48px 1fr auto;
      height: 100vh;
      overflow: hidden;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 16px;
      border-bottom: 1px solid var(--line);
      background: #12161a;
    }
    h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 600;
    }
    #status {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    #messages {
      overflow: auto;
      min-height: 0;
      padding: 18px 16px 24px;
      overscroll-behavior: contain;
    }
    .stack {
      width: min(860px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 12px;
    }
    .msg {
      max-width: min(720px, 92%);
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      line-height: 1.45;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .user {
      justify-self: end;
      background: var(--user);
    }
    .assistant {
      justify-self: start;
      background: var(--assistant);
    }
    .meta {
      color: var(--muted);
      font-size: 12px;
      margin-top: 6px;
    }
    form {
      border-top: 1px solid var(--line);
      background: #12161a;
      padding: 12px 16px;
      flex-shrink: 0;
    }
    .composer {
      width: min(860px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: end;
    }
    textarea {
      width: 100%;
      min-height: 48px;
      max-height: 160px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      padding: 12px;
      font: inherit;
      outline: none;
    }
    textarea:focus {
      border-color: var(--accent);
    }
    button {
      min-width: 82px;
      height: 48px;
      border: 1px solid #4aa98a;
      border-radius: 8px;
      background: #24594b;
      color: var(--text);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .icon-button {
      display: inline-grid;
      place-items: center;
      width: 34px;
      min-width: 34px;
      height: 34px;
      border-color: var(--line);
      background: var(--surface-2);
      font-size: 22px;
      line-height: 1;
      padding: 0;
    }
    button:disabled {
      opacity: .55;
      cursor: default;
    }
    .empty {
      margin: 12vh auto 0;
      width: min(620px, 100%);
      color: var(--muted);
      line-height: 1.5;
    }
    .empty strong {
      color: var(--text);
      font-weight: 600;
    }
    @media (max-width: 640px) {
      header { align-items: flex-start; flex-direction: column; height: auto; padding: 10px 12px; }
      .header-actions { width: 100%; justify-content: space-between; }
      main { grid-template-rows: auto 1fr auto; }
      .composer { grid-template-columns: 1fr; }
      button { width: 100%; }
      .icon-button { width: 34px; }
      .msg { max-width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Symbion</h1>
      <div class="header-actions">
        <div id="status">Starting native runtime...</div>
        <button class="icon-button" id="new-chat" type="button" title="New chat" aria-label="New chat">+</button>
      </div>
    </header>
    <section id="messages">
      <div class="stack" id="stack">
        <div class="empty" id="empty"></div>
      </div>
    </section>
    <form id="form">
      <div class="composer">
        <textarea id="input" autocomplete="off" placeholder=""></textarea>
        <button id="send" type="submit">Send</button>
      </div>
    </form>
  </main>
  <script>
    const stack = document.getElementById("stack");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const status = document.getElementById("status");
    const newChat = document.getElementById("new-chat");
    let sessionId = createSessionId();

    function createSessionId() {
      const random = crypto?.getRandomValues
        ? crypto.getRandomValues(new Uint32Array(2)).join("-")
        : Math.random().toString(16).slice(2);
      return `native-${Date.now()}-${random}`;
    }

    function renderEmpty() {
      stack.innerHTML = `<div class="empty" id="empty"></div>`;
    }

    function startNewChat() {
      sessionId = createSessionId();
      renderEmpty();
      input.value = "";
      input.focus();
      refreshHealth();
    }

    function addMessage(role, content, meta = "") {
      document.getElementById("empty")?.remove();
      const node = document.createElement("div");
      node.className = `msg ${role}`;
      node.textContent = content;
      if (meta) {
        const detail = document.createElement("div");
        detail.className = "meta";
        detail.textContent = meta;
        node.appendChild(detail);
      }
      stack.appendChild(node);
      node.scrollIntoView({ block: "end" });
    }

    async function refreshHealth() {
      try {
        const h = await fetch("/health").then((r) => r.json());
        status.textContent = `${h.runtime} | ${h.provider} | ${h.message_count} messages`;
      } catch {
        status.textContent = "backend unavailable";
      }
    }

    async function loadRecent() {
      try {
        const data = await fetch("/api/messages/recent").then((r) => r.json());
        for (const msg of data.messages || []) {
          addMessage(msg.role, msg.content);
        }
      } catch {}
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      input.value = "";
      send.disabled = true;
      addMessage("user", message);
      try {
        const result = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-Symbion-Session": sessionId
          },
          body: JSON.stringify({ message })
        }).then((r) => r.json());
        const emotion = result.emotion?.label
          ? `${result.emotion.label} ${result.emotion.intensity}/10`
          : "";
        addMessage("assistant", result.reply || "What feels most important in that right now?", emotion);
      } catch {
        addMessage("assistant", "I lost the local connection for a moment. What feels most important right now?");
      } finally {
        send.disabled = false;
        input.focus();
        refreshHealth();
      }
    });

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    newChat.addEventListener("click", startNewChat);
    refreshHealth();
    startNewChat();
    input.focus();
  </script>
</body>
</html>
