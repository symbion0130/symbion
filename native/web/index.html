<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050508">
  <title>Symbion</title>
  <link rel="icon" href="/assets/symbion.ico">
  <style>
    :root {
      color-scheme: dark;
      --bg: #050508;
      --surface: #0d0d14;
      --surface-2: #14141f;
      --surface-3: #1a1a29;
      --line: #2a2a3a;
      --text: #f0f0fa;
      --muted: #9090a8;
      --dim: #5a5a70;
      --sym: #8b5cf6;
      --sym-2: #6366f1;
      --sym-bright: #a78bfa;
      --you: #22d3ee;
      --you-soft: rgba(34, 211, 238, .14);
      --sym-soft: rgba(139, 92, 246, .16);
      --danger: #ef4444;
      --radius: 8px;
    }
    * { box-sizing: border-box; }
    html,
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Inter, system-ui, sans-serif;
      font-size: 16px;
      letter-spacing: 0;
      -webkit-font-smoothing: antialiased;
    }
    .shell {
      height: 100vh;
      display: grid;
      grid-template-rows: 54px 1fr auto;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 10%, rgba(99, 102, 241, .11), transparent 34%),
        linear-gradient(180deg, #050508 0%, #07070d 100%);
    }
    .appbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 0 14px;
      border-bottom: 1px solid var(--line);
      background: rgba(5, 5, 8, .88);
      backdrop-filter: blur(10px);
      z-index: 20;
    }
    .brand-side,
    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .mark {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      filter: drop-shadow(0 0 9px rgba(139, 92, 246, .55));
    }
    h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--sym);
      box-shadow: 0 0 12px rgba(139, 92, 246, .85);
    }
    .dot.dead {
      background: var(--danger);
      box-shadow: 0 0 10px rgba(239, 68, 68, .9);
    }
    .status-pills {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      overflow: hidden;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      max-width: 220px;
      min-height: 26px;
      padding: 4px 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(13, 13, 20, .72);
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .pill b {
      color: var(--text);
      font-weight: 600;
    }
    button {
      border: 1px solid rgba(139, 92, 246, .32);
      border-radius: var(--radius);
      background: rgba(20, 20, 31, .86);
      color: var(--text);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      border-color: rgba(167, 139, 250, .68);
      background: rgba(31, 31, 48, .92);
    }
    button:disabled {
      opacity: .55;
      cursor: default;
    }
    .icon-button {
      display: inline-grid;
      place-items: center;
      width: 36px;
      min-width: 36px;
      height: 36px;
      padding: 0;
      font-size: 18px;
      line-height: 1;
    }
    .primary-icon {
      border-color: rgba(34, 211, 238, .3);
      background: rgba(34, 211, 238, .12);
      color: #dffbff;
    }
    #chat {
      position: relative;
      min-height: 0;
      overflow: auto;
      overscroll-behavior: contain;
      padding: 24px clamp(14px, 3.2vw, 46px) 30px;
    }
    .watermark {
      position: fixed;
      left: 50%;
      top: calc(54px + ((100vh - 54px - 74px) / 2));
      width: clamp(210px, 49vmin, 500px);
      height: clamp(210px, 49vmin, 500px);
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
      opacity: 0;
      transition: opacity 2.5s ease;
    }
    body.has-messages .watermark {
      opacity: 1;
    }
    .logo-core {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      transform: none;
      will-change: opacity, filter;
    }
    .watermark .logo-core {
      opacity: .052;
      filter:
        drop-shadow(0 0 24px rgba(99, 102, 241, .34))
        drop-shadow(0 0 10px rgba(167, 139, 250, .28));
      transition: opacity 6s ease;
    }
    .watermark::before,
    .watermark::after,
    .empty-mark::before,
    .empty-mark::after {
      content: "";
      position: absolute;
      inset: -9%;
      border-radius: 50%;
      border: 8px solid rgba(255, 255, 255, .22);
      pointer-events: none;
      will-change: opacity, transform, box-shadow;
    }
    .watermark::before {
      opacity: .045;
      animation: ring-breathe 4.6s ease-in-out infinite;
      box-shadow:
        0 0 22px rgba(99, 102, 241, .22),
        0 0 7px rgba(167, 139, 250, .16);
      transition: opacity 6s ease;
    }
    .watermark::after {
      opacity: 0;
      animation: glow-breathe 2.35s ease-in-out infinite;
      transform: none;
      box-shadow:
        0 0 34px rgba(99, 102, 241, .4),
        0 0 11px rgba(167, 139, 250, .28);
      transition: opacity 6s ease;
      will-change: opacity, box-shadow;
    }
    body.typing .watermark::after {
      opacity: .16;
      transition: opacity .9s ease;
    }
    body.settling .watermark::after {
      opacity: .018;
      transition: opacity 9.5s ease;
    }
    @keyframes ring-breathe {
      0%, 100% {
        transform: scale(1);
        box-shadow:
          0 0 18px rgba(139, 92, 246, .22),
          0 0 6px rgba(167, 139, 250, .14);
      }
      50% {
        transform: scale(1.09);
        box-shadow:
          0 0 45px rgba(99, 102, 241, .44),
          0 0 12px rgba(167, 139, 250, .26);
      }
    }
    @keyframes glow-breathe {
      0%, 100% {
        box-shadow:
          0 0 26px rgba(139, 92, 246, .32),
          0 0 8px rgba(167, 139, 250, .22);
      }
      50% {
        box-shadow:
          0 0 68px rgba(109, 40, 217, .66),
          0 0 24px rgba(147, 51, 234, .46),
          0 0 9px rgba(216, 180, 254, .24);
      }
    }
    .stack {
      position: relative;
      z-index: 1;
      width: min(1180px, 100%);
      min-height: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .empty {
      position: fixed;
      inset: 54px 0 74px 0;
      margin: 0;
      width: auto;
      height: auto;
      display: grid;
      place-items: center;
      opacity: .95;
      pointer-events: none;
      z-index: 2;
    }
    .empty-mark {
      position: relative;
      width: 190px;
      height: 190px;
    }
    .empty-mark .logo-core {
      opacity: 1;
      filter:
        drop-shadow(0 0 28px rgba(99, 102, 241, .48))
        drop-shadow(0 0 10px rgba(167, 139, 250, .3));
      transition: opacity 6s ease;
    }
    .empty-mark::before {
      opacity: .26;
      animation: ring-empty 4.5s ease-in-out infinite;
      box-shadow:
        0 0 26px rgba(99, 102, 241, .42),
        0 0 9px rgba(167, 139, 250, .24);
    }
    .empty-mark::after {
      opacity: 0;
      animation: glow-empty 2.3s ease-in-out infinite;
      transform: none;
      box-shadow:
        0 0 36px rgba(99, 102, 241, .52),
        0 0 12px rgba(167, 139, 250, .32);
      transition: opacity 6s ease;
      will-change: opacity, box-shadow;
    }
    body.typing .empty-mark::after {
      opacity: .62;
      transition: opacity .9s ease;
    }
    body.settling .empty-mark::after {
      opacity: .045;
      transition: opacity 9.5s ease;
    }
    @keyframes ring-empty {
      0%, 100% {
        transform: scale(1);
        box-shadow:
          0 0 22px rgba(139, 92, 246, .32),
          0 0 8px rgba(167, 139, 250, .2);
      }
      50% {
        transform: scale(1.12);
        box-shadow:
          0 0 46px rgba(99, 102, 241, .52),
          0 0 13px rgba(167, 139, 250, .3);
      }
    }
    @keyframes glow-empty {
      0%, 100% {
        box-shadow:
          0 0 28px rgba(139, 92, 246, .4),
          0 0 10px rgba(167, 139, 250, .26);
      }
      50% {
        box-shadow:
          0 0 76px rgba(109, 40, 217, .72),
          0 0 28px rgba(147, 51, 234, .52),
          0 0 10px rgba(216, 180, 254, .28);
      }
    }
    .msg {
      animation: fadein .16s ease;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.55;
      backdrop-filter: blur(10px);
    }
    @keyframes fadein {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: none; }
    }
    .user {
      align-self: flex-end;
      max-width: min(680px, 62%);
      padding: 12px 15px;
      border: 1px solid rgba(34, 211, 238, .32);
      border-radius: var(--radius) var(--radius) 4px var(--radius);
      background: rgba(13, 13, 20, .64);
      box-shadow: inset 0 0 0 1px rgba(34, 211, 238, .05), 0 0 28px rgba(34, 211, 238, .08);
    }
    .assistant {
      align-self: flex-start;
      width: min(960px, 80%);
      max-width: 100%;
      padding: 14px 16px;
      border: 1px solid rgba(139, 92, 246, .22);
      border-radius: var(--radius);
      background: rgba(13, 13, 20, .66);
      box-shadow: inset 0 0 0 1px rgba(167, 139, 250, .04), 0 0 28px rgba(139, 92, 246, .06);
    }
    .label {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 7px;
      color: var(--sym-bright);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 18px;
      padding: 1px 6px;
      border: 1px solid rgba(167, 139, 250, .25);
      border-radius: 999px;
      color: var(--muted);
      font-size: 11px;
      text-transform: none;
      letter-spacing: 0;
    }
    .meta {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
    }
    #composer-form {
      border-top: 1px solid var(--line);
      background: rgba(5, 5, 8, .9);
      backdrop-filter: blur(10px);
      padding: 12px 16px 14px;
      z-index: 20;
    }
    .composer {
      width: min(980px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      align-items: end;
    }
    textarea {
      width: 100%;
      min-height: 56px;
      max-height: 170px;
      resize: none;
      border: 1px solid rgba(139, 92, 246, .28);
      border-radius: var(--radius);
      background: rgba(13, 13, 20, .9);
      color: var(--text);
      padding: 12px 13px;
      font: inherit;
      outline: none;
      box-shadow: inset 0 0 0 1px rgba(167, 139, 250, .03);
    }
    textarea:focus {
      border-color: rgba(167, 139, 250, .75);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, .12);
    }
    .send {
      min-width: 76px;
      height: 56px;
      padding: 0 18px;
      border-color: rgba(139, 92, 246, .62);
      background: linear-gradient(135deg, var(--sym), var(--sym-2));
      box-shadow: 0 0 24px rgba(139, 92, 246, .2);
      font-size: 14px;
      letter-spacing: 0;
    }
    .composer .icon-button {
      width: 44px;
      min-width: 44px;
      height: 56px;
    }
    #file-input {
      display: none;
    }
    .attach-strip {
      width: min(980px, 100%);
      margin: 0 auto 8px;
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }
    .attach-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 28px;
      max-width: 260px;
      padding: 4px 8px;
      border: 1px solid rgba(34, 211, 238, .22);
      border-radius: 999px;
      background: rgba(34, 211, 238, .08);
      color: var(--muted);
      font-size: 12px;
    }
    .attach-chip span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .attach-chip button {
      width: 18px;
      min-width: 18px;
      height: 18px;
      padding: 0;
      border-color: transparent;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
    }
    .scrim {
      position: fixed;
      inset: 0;
      display: none;
      background: rgba(0, 0, 0, .44);
      z-index: 35;
    }
    .drawer {
      position: fixed;
      inset: 0 auto 0 0;
      width: min(360px, 88vw);
      display: grid;
      grid-template-rows: auto 1fr;
      transform: translateX(-105%);
      transition: transform .18s ease;
      border-right: 1px solid var(--line);
      background: rgba(8, 8, 13, .96);
      backdrop-filter: blur(14px);
      z-index: 40;
      box-shadow: 28px 0 70px rgba(0, 0, 0, .35);
    }
    body.drawer-open .drawer { transform: translateX(0); }
    body.drawer-open .scrim { display: block; }
    .drawer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 58px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
    }
    .drawer-brand {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
    }
    .drawer-scroll {
      min-height: 0;
      overflow: auto;
      padding: 12px;
    }
    .section-title {
      margin: 16px 0 8px;
      color: var(--dim);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
    }
    .drawer-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .drawer-action {
      min-height: 38px;
      padding: 8px 10px;
      color: var(--muted);
      font-size: 13px;
      text-align: left;
    }
    .tool-panel {
      margin-top: 10px;
      border: 1px solid rgba(139, 92, 246, .18);
      border-radius: var(--radius);
      background: rgba(13, 13, 20, .45);
    }
    .tool-panel summary {
      padding: 10px;
      color: var(--muted);
      font-weight: 700;
      list-style: none;
    }
    .tool-panel summary::-webkit-details-marker {
      display: none;
    }
    .tool-panel summary::after {
      content: "+";
      float: right;
      color: var(--sym-bright);
    }
    .tool-panel[open] summary::after {
      content: "-";
    }
    .tool-list {
      display: grid;
      gap: 6px;
      padding: 0 10px 10px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }
    .session-list {
      display: grid;
      gap: 7px;
    }
    .session-item {
      display: grid;
      grid-template-columns: 1fr 34px;
      gap: 6px;
      align-items: stretch;
    }
    .session-toggle {
      width: 100%;
      min-height: 34px;
      margin-top: 7px;
      border-color: rgba(139, 92, 246, .22);
      background: rgba(139, 92, 246, .08);
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }
    .session-row {
      width: 100%;
      min-height: 46px;
      height: auto;
      padding: 9px 10px;
      border-color: var(--line);
      background: rgba(13, 13, 20, .62);
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      text-align: left;
      overflow-wrap: anywhere;
    }
    .session-row.active {
      color: var(--text);
      border-color: rgba(34, 211, 238, .35);
      background: rgba(34, 211, 238, .1);
    }
    .session-delete {
      min-width: 34px;
      width: 34px;
      min-height: 46px;
      border-color: rgba(239, 68, 68, .24);
      background: rgba(239, 68, 68, .06);
      color: #ffc9c9;
      font-size: 16px;
      padding: 0;
    }
    .status-panel {
      display: grid;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
    }
    .status-line {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(42, 42, 58, .55);
    }
    .status-line b {
      color: var(--text);
      font-weight: 600;
      text-align: right;
    }
    details {
      margin-top: 14px;
      color: var(--muted);
      font-size: 13px;
    }
    summary {
      cursor: pointer;
      color: var(--dim);
    }
    .danger {
      width: 100%;
      margin-top: 10px;
      min-height: 38px;
      border-color: rgba(239, 68, 68, .28);
      background: rgba(239, 68, 68, .08);
      color: #ffc9c9;
    }
    @media (max-width: 760px) {
      .status-pills .pill:not(:first-child) { display: none; }
      .brand-side h1 { font-size: 13px; }
      .composer { grid-template-columns: auto 1fr auto; }
      #chat { padding: 18px 12px 24px; }
      .watermark { top: calc(54px + ((100vh - 54px - 120px) / 2)); }
      .empty { inset: 54px 0 120px 0; }
      .user { max-width: 92%; }
      .assistant { padding: 13px 14px; }
      .session-item { grid-template-columns: 1fr 40px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="appbar">
      <div class="brand-side">
        <button class="icon-button" id="menu" type="button" title="Menu" aria-label="Menu">☰</button>
        <img class="mark" src="/assets/symbion-mark.svg" alt="">
        <h1>Symbion</h1>
      </div>
      <div class="header-actions">
        <div class="status-pills" aria-live="polite">
          <span class="pill"><span class="dot" id="dot"></span><b id="runtime">native</b></span>
          <span class="pill">LLM <b id="provider">local</b></span>
          <span class="pill">Turns <b id="message-count">--</b></span>
        </div>
      </div>
    </header>

    <aside class="drawer" id="drawer" aria-label="Symbion menu">
      <div class="drawer-head">
        <div class="drawer-brand">
          <img class="mark" src="/assets/symbion-mark.svg" alt="">
          <span>Symbion</span>
        </div>
        <button class="icon-button" id="close-drawer" type="button" title="Close menu" aria-label="Close menu">×</button>
      </div>
      <div class="drawer-scroll">
        <div class="drawer-actions">
          <button class="drawer-action" id="drawer-new" type="button">New chat</button>
          <button class="drawer-action" id="clear-current" type="button">Clear current</button>
        </div>

        <details class="tool-panel" id="tool-panel">
          <summary>Tools</summary>
          <div class="tool-list">
            <div>Exact math, date, and time</div>
            <div>Local file and folder reads</div>
            <div>URL fetch and lightweight web search</div>
            <div>Weather lookup</div>
            <div>Memory and session recall</div>
          </div>
        </details>

        <div class="section-title">Recent sessions</div>
        <div class="session-list" id="sessions"></div>

        <div class="section-title">Runtime</div>
        <div class="status-panel" id="status-panel">
          <div class="status-line"><span>Backend</span><b>starting</b></div>
        </div>

        <details>
          <summary>Privacy reset</summary>
          <button class="danger" id="wipe-memory" type="button">Ask to wipe all memory</button>
        </details>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <section id="chat" aria-label="Chat">
      <div class="watermark" aria-hidden="true">
        <img class="logo-core" src="/assets/symbion-mark.svg" alt="">
      </div>
      <div class="stack" id="stack">
        <div class="empty" id="empty">
          <div class="empty-mark">
            <img class="logo-core" src="/assets/symbion-mark.svg" alt="">
          </div>
        </div>
      </div>
    </section>

    <form id="composer-form">
      <div class="attach-strip" id="attach-strip"></div>
      <div class="composer">
        <button class="icon-button" id="attach" type="button" title="Attach files" aria-label="Attach files">+</button>
        <input id="file-input" type="file" multiple>
        <textarea id="input" autocomplete="off" placeholder="" rows="1"></textarea>
        <button class="send" id="send" type="submit" title="Send" aria-label="Send">Send</button>
      </div>
    </form>
  </main>

  <script>
    const stack = document.getElementById("stack");
    const chat = document.getElementById("chat");
    const form = document.getElementById("composer-form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const sessions = document.getElementById("sessions");
    const menu = document.getElementById("menu");
    const drawer = document.getElementById("drawer");
    const closeDrawer = document.getElementById("close-drawer");
    const scrim = document.getElementById("scrim");
    const drawerNew = document.getElementById("drawer-new");
    const clearCurrent = document.getElementById("clear-current");
    const toolPanel = document.getElementById("tool-panel");
    const wipeMemory = document.getElementById("wipe-memory");
    const attach = document.getElementById("attach");
    const fileInput = document.getElementById("file-input");
    const attachStrip = document.getElementById("attach-strip");
    const runtime = document.getElementById("runtime");
    const provider = document.getElementById("provider");
    const messageCount = document.getElementById("message-count");
    const statusPanel = document.getElementById("status-panel");
    const dot = document.getElementById("dot");
    let sessionId = createSessionId();
    let lastHealth = null;
    let sessionsExpanded = false;
    let pendingAttachments = [];
    const maxAttachmentChars = 200000;

    function createSessionId() {
      const random = crypto?.getRandomValues
        ? Array.from(crypto.getRandomValues(new Uint32Array(2))).join("-")
        : Math.random().toString(16).slice(2);
      return `native-${Date.now()}-${random}`;
    }

    function openDrawer() {
      document.body.classList.add("drawer-open");
      refreshSessions();
      refreshHealth();
    }

    function closeMenu() {
      document.body.classList.remove("drawer-open");
    }

    function renderEmpty() {
      stack.innerHTML = `<div class="empty" id="empty"><div class="empty-mark"><img class="logo-core" src="/assets/symbion-mark.svg" alt=""></div></div>`;
      document.body.classList.remove("has-messages");
    }

    function startNewChat() {
      sessionId = createSessionId();
      renderEmpty();
      input.value = "";
      pendingAttachments = [];
      renderAttachments();
      autoSizeInput();
      input.focus();
      refreshHealth();
      refreshSessions();
      closeMenu();
    }

    function addMessage(role, content, meta = "") {
      document.getElementById("empty")?.remove();
      document.body.classList.add("has-messages");
      const node = document.createElement("div");
      node.className = `msg ${role}`;
      if (role === "assistant") {
        const label = document.createElement("div");
        label.className = "label";
        label.textContent = "Symbion";
        if (meta) {
          const badge = document.createElement("span");
          badge.className = "badge";
          badge.textContent = meta;
          label.appendChild(badge);
        }
        const body = document.createElement("div");
        body.textContent = content;
        node.append(label, body);
      } else {
        node.textContent = content;
      }
      stack.appendChild(node);
      chat.scrollTop = chat.scrollHeight;
    }

    function addLocalSymbion(text) {
      addMessage("assistant", text);
    }

    function renderAttachments() {
      attachStrip.innerHTML = "";
      for (const [index, file] of pendingAttachments.entries()) {
        const chip = document.createElement("div");
        chip.className = "attach-chip";
        const label = document.createElement("span");
        label.textContent = file.name;
        const remove = document.createElement("button");
        remove.type = "button";
        remove.textContent = "x";
        remove.title = "Remove attachment";
        remove.addEventListener("click", () => {
          pendingAttachments.splice(index, 1);
          renderAttachments();
        });
        chip.append(label, remove);
        attachStrip.appendChild(chip);
      }
    }

    function readFileAsText(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ""));
        reader.onerror = () => resolve("");
        reader.readAsText(file);
      });
    }

    async function addFiles(files) {
      for (const file of Array.from(files || [])) {
        const text = await readFileAsText(file);
        const clipped = text.length > maxAttachmentChars
          ? `${text.slice(0, maxAttachmentChars)}\n\n[attachment trimmed]`
          : text;
        pendingAttachments.push({
          name: file.name || "attachment",
          size: file.size || 0,
          text: clipped
        });
      }
      renderAttachments();
      input.focus();
    }

    function messageWithAttachments(message) {
      if (!pendingAttachments.length) return message;
      const blocks = pendingAttachments.map((file) =>
        `\n\n[Attached file: ${file.name}; ${file.size} bytes]\n${file.text || "[No readable text extracted in the browser.]"}`
      );
      return `${message}${blocks.join("")}`;
    }

    function renderStatusPanel(h) {
      statusPanel.innerHTML = "";
      const rows = [
        ["Runtime", h?.runtime || "native-cpp"],
        ["Provider", h?.provider || "local_gemma"],
        ["Messages", String(h?.message_count ?? "--")],
        ["Database", h?.db_path || "data/symbion.db"]
      ];
      for (const [label, value] of rows) {
        const row = document.createElement("div");
        row.className = "status-line";
        row.innerHTML = `<span></span><b></b>`;
        row.querySelector("span").textContent = label;
        row.querySelector("b").textContent = value;
        statusPanel.appendChild(row);
      }
    }

    async function refreshHealth() {
      try {
        const h = await fetch("/health").then((r) => r.json());
        lastHealth = h;
        dot.classList.remove("dead");
        runtime.textContent = h.runtime || "native";
        provider.textContent = h.provider || "local";
        messageCount.textContent = h.message_count ?? "--";
        renderStatusPanel(h);
      } catch {
        dot.classList.add("dead");
        runtime.textContent = "offline";
        renderStatusPanel(null);
      }
    }

    async function loadSession(id) {
      try {
        sessionId = id;
        renderEmpty();
        const data = await fetch(`/api/sessions/${encodeURIComponent(id)}/messages?limit=100`).then((r) => r.json());
        for (const msg of data.messages || []) {
          addMessage(msg.role === "assistant" ? "assistant" : "user", msg.content);
        }
        refreshSessions();
        closeMenu();
        input.focus();
      } catch {
        addLocalSymbion("I could not load that session cleanly.");
      }
    }

    async function refreshSessions() {
      try {
        const data = await fetch("/api/sessions?limit=40").then((r) => r.json());
        sessions.innerHTML = "";
        const all = data.sessions || [];
        const visible = sessionsExpanded ? all.slice(0, 15) : all.slice(0, 5);
        for (const item of visible) {
          const wrap = document.createElement("div");
          wrap.className = "session-item";
          const button = document.createElement("button");
          button.type = "button";
          button.className = `session-row${item.id === sessionId ? " active" : ""}`;
          const title = item.title || item.id || "session";
          button.textContent = `${title}\n${item.turn_count || 0} messages`;
          button.addEventListener("click", () => loadSession(item.id));
          const del = document.createElement("button");
          del.type = "button";
          del.className = "session-delete";
          del.title = "Delete session";
          del.setAttribute("aria-label", "Delete session");
          del.textContent = "x";
          del.addEventListener("click", (event) => {
            event.stopPropagation();
            deleteSession(item.id);
          });
          wrap.append(button, del);
          sessions.appendChild(wrap);
        }
        if (!sessions.children.length) {
          const empty = document.createElement("div");
          empty.className = "status-line";
          empty.innerHTML = "<span>No saved sessions yet</span><b></b>";
          sessions.appendChild(empty);
        }
        if (all.length > 5) {
          const toggle = document.createElement("button");
          toggle.type = "button";
          toggle.className = "session-toggle";
          toggle.textContent = sessionsExpanded ? "Show fewer sessions" : `Show 10 more sessions`;
          toggle.addEventListener("click", () => {
            sessionsExpanded = !sessionsExpanded;
            refreshSessions();
          });
          sessions.appendChild(toggle);
        }
      } catch {}
    }

    async function sendChat(message) {
      const body = JSON.stringify({ message });
      const result = await fetch("/api/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-Symbion-Session": sessionId
        },
        body
      }).then((r) => r.json());
      const emotion = result.emotion?.label
        ? `${result.emotion.label} ${result.emotion.intensity}/10`
        : "";
      addMessage("assistant", result.reply || "I lost the thread for a second. Say that one more way.", emotion);
      refreshHealth();
      refreshSessions();
    }

    async function deleteSession(id) {
      const wasActive = id === sessionId;
      try {
        await fetch(`/api/sessions?id=${encodeURIComponent(id)}`, {
          method: "DELETE",
          headers: { "X-Symbion-Session": id }
        });
        if (wasActive) startNewChat();
        else refreshSessions();
        refreshHealth();
      } catch {
        addLocalSymbion("I could not delete that session cleanly.");
      }
    }

    function handleSlashCommand(text) {
      const lower = text.toLowerCase();
      if (lower === "/new") {
        startNewChat();
        return true;
      }
      if (lower === "/sessions") {
        openDrawer();
        return true;
      }
      if (lower === "/status") {
        const h = lastHealth;
        addLocalSymbion(`Runtime: ${h?.runtime || "native-cpp"}\nProvider: ${h?.provider || "local_gemma"}\nMessages: ${h?.message_count ?? "--"}\nDatabase: ${h?.db_path || "data/symbion.db"}`);
        return true;
      }
      if (lower === "/tools") {
        openDrawer();
        toolPanel.open = true;
        return true;
      }
      if (lower === "/memory") {
        addLocalSymbion("Memory is retrieved on demand from SQLite. Use the session list to reopen old chats, or ask naturally about something you want Symbion to recall.");
        return true;
      }
      if (lower === "/forget") {
        sendChat("forget this chat");
        return true;
      }
      return false;
    }

    function autoSizeInput() {
      input.style.height = "auto";
      input.style.height = `${Math.min(input.scrollHeight, 150)}px`;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message && !pendingAttachments.length) return;
      const attachmentCount = pendingAttachments.length;
      const display = attachmentCount
        ? `${message || "Attached file."}\n[+${attachmentCount} file${attachmentCount === 1 ? "" : "s"}]`
        : message;
      const outbound = messageWithAttachments(message || "Attached file.");
      pendingAttachments = [];
      renderAttachments();
      input.value = "";
      autoSizeInput();
      if (message.startsWith("/") && handleSlashCommand(message)) return;
      send.disabled = true;
      addMessage("user", display);
      try {
        await sendChat(outbound);
      } catch {
        addLocalSymbion("I lost the local connection for a moment. Try me again.");
      } finally {
        send.disabled = false;
        input.focus();
      }
    });

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    let typingTimer = null;
    let settlingTimer = null;
    input.addEventListener("input", () => {
      autoSizeInput();
      document.body.classList.remove("settling");
      document.body.classList.add("typing");
      clearTimeout(typingTimer);
      clearTimeout(settlingTimer);
      typingTimer = setTimeout(() => {
        document.body.classList.remove("typing");
        document.body.classList.add("settling");
        settlingTimer = setTimeout(() => document.body.classList.remove("settling"), 9500);
      }, 1600);
    });

    menu.addEventListener("click", openDrawer);
    closeDrawer.addEventListener("click", closeMenu);
    scrim.addEventListener("click", closeMenu);
    drawerNew.addEventListener("click", startNewChat);
    clearCurrent.addEventListener("click", () => {
      deleteSession(sessionId);
      closeMenu();
    });
    attach.addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", () => {
      addFiles(fileInput.files || []);
      fileInput.value = "";
    });
    wipeMemory.addEventListener("click", () => {
      closeMenu();
      addMessage("user", "wipe all memory");
      sendChat("wipe all memory");
    });
    refreshHealth();
    startNewChat();
    setInterval(refreshHealth, 30000);
  </script>
</body>
</html>
