[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "symbion"
version = "14.0.0"
description = "Async AI assistant with multi-provider LLM support, behavioral safety, and longitudinal identity"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.24",
    "prompt_toolkit>=3.0",  # terminal REPL line editing (arrow keys move cursor
                            # instead of cycling Windows console history)
]

[project.optional-dependencies]
# uvicorn[standard] pulls websockets+wsproto so /ws/{session_id} works.
# Bare `uvicorn` accepts the upgrade request and then logs
# "Unsupported upgrade request" — the WebSocket UI silently fails.
web = ["fastapi>=0.100", "uvicorn[standard]>=0.20"]

[project.scripts]
symbion = "symbion.__main__:main"

[tool.setuptools]
# symbion_v14.py lives at the repo root as a top-level module (the
# active codebase, per CLAUDE.md). Without this declaration, an editable
# install registers only the symbion/ wrapper package and `import
# symbion_v14` fails — which breaks the package's own __init__.py.
py-modules = ["symbion_v14"]

[tool.setuptools.packages.find]
include = ["symbion*"]

[tool.setuptools.package-data]
"symbion.web.templates" = ["*.html"]
