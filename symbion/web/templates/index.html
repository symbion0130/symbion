<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<title>Symbion</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0a0c;--surface:#15151a;--surface-2:#1d1d24;--border:#262630;
  --text:#eaeaf0;--muted:#6a6a78;--muted-2:#9a9aac;
  --sym:#a78bfa;--sym-soft:#a78bfa22;--you:#34d399;--you-soft:#34d39920;
  --accent:#7c3aed;--warn:#f59e0b;--danger:#ef4444;
  --thinking:#15172a;--thinking-border:#2a2d4a;
  --radius:14px;
}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
  font-size:15px;line-height:1.55;
  display:flex;flex-direction:column;
  -webkit-font-smoothing:antialiased;
}

header{
  padding:.6rem 1rem;
  padding-top:max(.6rem,env(safe-area-inset-top));
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:.65rem;flex-shrink:0;
  background:linear-gradient(180deg,var(--bg) 0%,#0a0a0cf2 100%);
  backdrop-filter:blur(6px);
}
.dot{width:7px;height:7px;border-radius:50%;background:#22c55e;flex-shrink:0;box-shadow:0 0 8px #22c55e88}
.dot.dead{background:var(--danger);box-shadow:0 0 8px #ef444488}
.brand{font-size:.95rem;font-weight:700;color:var(--text);letter-spacing:.01em}
.brand .ver{font-size:.7rem;color:var(--muted);font-weight:500;margin-left:.35rem}
#statusbar{
  margin-left:auto;display:flex;gap:.4rem;flex-wrap:nowrap;overflow-x:auto;
  scrollbar-width:none;-ms-overflow-style:none;
}
#statusbar::-webkit-scrollbar{display:none}
.pill{
  display:inline-flex;align-items:center;gap:.3rem;
  font-size:.68rem;color:var(--muted-2);
  background:var(--surface);border:1px solid var(--border);
  padding:.2rem .55rem;border-radius:999px;
  white-space:nowrap;
}
.pill b{color:var(--text);font-weight:600}
.pill.warn{background:#3a2a0033;border-color:#3a2a00;color:var(--warn)}
.pill.warn b{color:var(--warn)}
#st-welfare{display:none}

main{flex:1;overflow:hidden;display:flex;flex-direction:column}
#chat{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:1.5rem 1rem 1rem;
  scroll-behavior:smooth;
}
#chat-inner{
  max-width:760px;margin:0 auto;
  display:flex;flex-direction:column;gap:1.4rem;
}

.msg{animation:fadein .18s ease;word-wrap:break-word}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.msg.you{
  align-self:flex-end;max-width:min(85%,560px);
  background:var(--you-soft);
  border:1px solid #34d39933;
  border-radius:var(--radius) var(--radius) 4px var(--radius);
  padding:.65rem .9rem;color:#a7f3d0;
  font-size:.95rem;line-height:1.5;
  white-space:pre-wrap;word-break:break-word;
}

.msg.sym{align-self:stretch;max-width:100%}
.msg-label{
  font-size:.7rem;font-weight:700;color:var(--sym);
  letter-spacing:.04em;text-transform:uppercase;
  margin-bottom:.35rem;display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;
}
.msg-body{
  white-space:pre-wrap;word-break:break-word;
  color:var(--text);font-size:.95rem;line-height:1.65;
}

.thinking-block{
  background:var(--thinking);border:1px solid var(--thinking-border);
  border-radius:10px;padding:.7rem .9rem;
  font-size:.85rem;color:#a3a8d0;font-style:italic;line-height:1.55;
}
.thinking-label{
  font-size:.65rem;color:#8a8fbb;font-style:normal;font-weight:700;
  text-transform:uppercase;letter-spacing:.06em;margin-bottom:.35rem;
}

.cursor{
  display:inline-block;width:2px;height:1em;background:var(--sym);
  animation:blink .9s step-end infinite;vertical-align:text-bottom;margin-left:1px;
}
@keyframes blink{50%{opacity:0}}

.badge{
  font-size:.6rem;padding:.1rem .45rem;border-radius:4px;font-weight:600;
  text-transform:uppercase;letter-spacing:.03em;
}
.b-rev{background:#1e3a5f44;color:#7dd3fc;border:1px solid #1e3a5f}
.b-warn{background:#3a2a0044;color:var(--warn);border:1px solid #3a2a00}
.b-emotion{background:#1a2a1a44;color:#86efac;border:1px solid #1a2a1a}
.meta{
  font-size:.65rem;color:var(--muted);margin-top:.35rem;
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}

footer{
  padding:.65rem 1rem;
  padding-bottom:max(.65rem,env(safe-area-inset-bottom));
  border-top:1px solid var(--border);
  background:var(--bg);
  display:flex;justify-content:center;flex-shrink:0;
}
.composer{
  width:100%;max-width:760px;
  display:flex;gap:.5rem;align-items:flex-end;
}
#inp{
  flex:1;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:.7rem .95rem;
  color:var(--text);font-size:1rem;font-family:inherit;
  resize:none;outline:none;max-height:140px;
  transition:border-color .15s,background .15s;
  line-height:1.45;
}
#inp::placeholder{color:var(--muted)}
#inp:focus{border-color:var(--accent);background:var(--surface-2)}

.icon-btn,.send-btn{
  border:none;border-radius:var(--radius);
  cursor:pointer;flex-shrink:0;font-weight:600;
  transition:opacity .15s,transform .1s,background .15s;
  font-family:inherit;
}
.icon-btn{
  background:transparent;color:var(--muted);
  border:1px solid var(--border);
  font-size:1rem;width:44px;height:44px;
  display:flex;align-items:center;justify-content:center;
}
.icon-btn.active{color:var(--sym);border-color:var(--sym);background:var(--sym-soft)}
.send-btn{
  background:var(--accent);color:#fff;
  padding:0 1.1rem;height:44px;
  font-size:.92rem;letter-spacing:.02em;
}
.send-btn:disabled{opacity:.35;cursor:not-allowed}

.attach-strip{
  width:100%;max-width:760px;margin:0 auto .4rem;
  display:flex;flex-wrap:wrap;gap:.4rem;
}
.attach-strip:empty{display:none}
.attach-thumb{
  position:relative;width:60px;height:60px;border-radius:8px;
  border:1px solid var(--border);overflow:hidden;background:var(--surface-2);
}
.attach-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.attach-thumb .x{
  position:absolute;top:2px;right:2px;width:18px;height:18px;
  border-radius:50%;background:rgba(0,0,0,.7);color:#fff;
  border:none;font-size:.75rem;cursor:pointer;line-height:1;
  display:flex;align-items:center;justify-content:center;padding:0;
}
.composer.drag-over #inp{border-color:var(--accent);background:var(--surface-2)}
.send-btn:not(:disabled):hover{background:#8b3df0}
.send-btn:not(:disabled):active{transform:scale(.97)}

::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#2c2c38;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#3a3a48}

@media (max-width:540px){
  header{padding:.55rem .75rem;padding-top:max(.55rem,env(safe-area-inset-top))}
  .brand{font-size:.88rem}
  .pill{font-size:.62rem;padding:.18rem .45rem}
  #chat{padding:1rem .75rem .75rem}
  #chat-inner{gap:1.1rem}
  .msg.you{max-width:90%;font-size:.92rem}
  .msg-body{font-size:.92rem}
  footer{padding:.55rem .65rem;padding-bottom:max(.55rem,env(safe-area-inset-bottom))}
  .composer{gap:.4rem}
  #inp{font-size:16px;padding:.6rem .8rem}
  .icon-btn{width:42px;height:42px}
  .send-btn{padding:0 .9rem;height:42px;font-size:.88rem}
}
</style>
</head>
<body>
<header>
  <div class="dot" id="dot" aria-label="connection"></div>
  <div class="brand">Symbion<span class="ver">v14</span></div>
  <div id="statusbar">
    <span class="pill">mood <b id="st-mood">--</b></span>
    <span class="pill">sym <b id="st-sym">--</b></span>
    <span class="pill" id="st-dist-pill">dist <b id="st-dist">--</b></span>
    <span class="pill warn" id="st-welfare"><b>! welfare</b></span>
  </div>
</header>
<main>
  <div id="chat"><div id="chat-inner"></div></div>
</main>
<footer>
  <div id="attach-strip" class="attach-strip"></div>
  <div class="composer">
    <textarea id="inp" rows="1" placeholder="Talk to Symbion... (paste or drop images)" autocomplete="off"></textarea>
    <button id="think-btn" class="icon-btn" title="Toggle reasoning trace" aria-label="Toggle reasoning">?</button>
    <button id="btn" class="send-btn">Send</button>
  </div>
</footer>
<script>
const chat=document.getElementById('chat');
const chatInner=document.getElementById('chat-inner');
const inp=document.getElementById('inp');
const btn=document.getElementById('btn');
const thinkBtn=document.getElementById('think-btn');
const SESSION=Math.random().toString(36).slice(2);
let ws, activeMsg=null, activeCursor=null, activeThinking=null, showReasoning=false;

function nearBottom(){return chat.scrollHeight-chat.scrollTop-chat.clientHeight<80}
function scrollToBottom(force){if(force||nearBottom())chat.scrollTop=chat.scrollHeight}

thinkBtn.onclick=()=>{
  showReasoning=!showReasoning;
  thinkBtn.classList.toggle('active',showReasoning);
  if(ws&&ws.readyState===1) ws.send(JSON.stringify({type:'toggle_reasoning',value:showReasoning}));
};

function connect(){
  const proto=location.protocol==='https:'?'wss':'ws';
  ws=new WebSocket(`${proto}://${location.host}/ws/${SESSION}`);
  ws.onopen=()=>{document.getElementById('dot').classList.remove('dead')};
  ws.onclose=()=>{document.getElementById('dot').classList.add('dead');setTimeout(connect,3000)};
  ws.onmessage=e=>{
    const d=JSON.parse(e.data);
    if(d.t==='tok'){
      if(!activeMsg) startMsg();
      appendTok(d.v);
    } else if(d.t==='thinking_tok'){
      if(!activeThinking) startThinking();
      appendThinkingTok(d.v);
    } else if(d.t==='thinking_end'){
      endThinking();
    } else if(d.t==='revise'){
      if(activeCursor) activeCursor.remove();
      if(activeMsg){
        activeMsg.querySelector('.msg-body').textContent='';
        activeCursor=document.createElement('span');
        activeCursor.className='cursor';
        activeMsg.querySelector('.msg-body').appendChild(activeCursor);
      }
    } else if(d.t==='done'){
      finishMsg(d.meta,d.badges,d.emotion);
      updateStatus(d.status);
      btn.disabled=false;
    } else if(d.t==='status'){
      updateStatus(d);
    }
  };
}

function updateStatus(s){
  if(!s)return;
  if(s.mood) document.getElementById('st-mood').textContent=s.mood;
  if(s.sym)  document.getElementById('st-sym').textContent=s.sym;
  const de=document.getElementById('st-dist');
  if(s.dist!==undefined){
    de.textContent=s.dist||'--';
    document.getElementById('st-dist-pill').classList.toggle('warn',parseFloat(s.dist||0)>0.5);
  }
  document.getElementById('st-welfare').style.display=
    (s.welfare&&s.welfare!=='null'&&s.welfare!=='None')?'':'none';
}

function startMsg(){
  activeMsg=document.createElement('div');
  activeMsg.className='msg sym';
  activeMsg.innerHTML='<div class="msg-label">Symbion</div><div class="msg-body"></div>';
  activeCursor=document.createElement('span');
  activeCursor.className='cursor';
  activeMsg.querySelector('.msg-body').appendChild(activeCursor);
  chatInner.appendChild(activeMsg);
  scrollToBottom(true);
}

function startThinking(){
  const wrap=document.createElement('div');
  wrap.className='msg sym';
  const block=document.createElement('div');
  block.className='thinking-block';
  block.innerHTML='<div class="thinking-label">Thinking</div>';
  activeThinking=document.createElement('div');
  activeThinking.style.whiteSpace='pre-wrap';
  block.appendChild(activeThinking);
  wrap.appendChild(block);
  chatInner.appendChild(wrap);
  scrollToBottom(true);
}

function appendThinkingTok(tok){
  if(activeThinking){activeThinking.textContent+=tok;scrollToBottom()}
}
function endThinking(){activeThinking=null}

function appendTok(tok){
  if(!activeMsg)return;
  const body=activeMsg.querySelector('.msg-body');
  body.insertBefore(document.createTextNode(tok),activeCursor);
  scrollToBottom();
}

function finishMsg(meta,badges,emotion){
  if(activeCursor){activeCursor.remove();activeCursor=null}
  if(activeMsg&&badges&&badges.length){
    const label=activeMsg.querySelector('.msg-label');
    badges.forEach(b=>{
      const s=document.createElement('span');
      s.className='badge b-'+b.cls;s.textContent=b.label;
      label.appendChild(s);
    });
  }
  if(emotion&&emotion!=='neutral'&&emotion!==''&&activeMsg){
    const label=activeMsg.querySelector('.msg-label');
    const s=document.createElement('span');
    s.className='badge b-emotion';s.textContent=emotion;
    label.appendChild(s);
  }
  if(meta&&activeMsg){
    const m=document.createElement('div');
    m.className='meta';m.textContent=meta;
    activeMsg.appendChild(m);
  }
  activeMsg=null;
  scrollToBottom();
}

function addYou(text){
  const d=document.createElement('div');
  d.className='msg you';d.textContent=text;
  chatInner.appendChild(d);
  scrollToBottom(true);
}

// === Image attachments ===
const attachStrip=document.getElementById('attach-strip');
const composer=document.querySelector('.composer');
const MAX_IMAGES=6, MAX_BYTES=10*1024*1024;
let pending=[];

function renderThumbs(){
  attachStrip.innerHTML='';
  pending.forEach((du,i)=>{
    const t=document.createElement('div');t.className='attach-thumb';
    const img=document.createElement('img');img.src=du;t.appendChild(img);
    const x=document.createElement('button');x.className='x';x.textContent='x';
    x.onclick=()=>{pending.splice(i,1);renderThumbs()};
    t.appendChild(x);attachStrip.appendChild(t);
  });
}
function addFile(f){
  if(!f||!f.type||!f.type.startsWith('image/'))return;
  if(f.size>MAX_BYTES){console.warn('image too large, skipping');return}
  if(pending.length>=MAX_IMAGES)return;
  const r=new FileReader();
  r.onload=()=>{pending.push(r.result);renderThumbs()};
  r.readAsDataURL(f);
}

inp.addEventListener('paste',e=>{
  const items=e.clipboardData&&e.clipboardData.items;
  if(!items)return;
  for(const it of items){
    if(it.kind==='file'){const f=it.getAsFile();if(f)addFile(f)}
  }
});
['dragenter','dragover'].forEach(ev=>composer.addEventListener(ev,e=>{
  e.preventDefault();composer.classList.add('drag-over');
}));
['dragleave','drop'].forEach(ev=>composer.addEventListener(ev,e=>{
  e.preventDefault();composer.classList.remove('drag-over');
}));
composer.addEventListener('drop',e=>{
  const files=e.dataTransfer&&e.dataTransfer.files;
  if(!files)return;
  for(const f of files) addFile(f);
});

function send(){
  const text=inp.value.trim();
  if((!text&&!pending.length)||!ws||ws.readyState!==1)return;
  const display=text+(pending.length?` [+${pending.length} image${pending.length>1?'s':''}]`:'');
  addYou(display);
  const images=pending.slice();
  pending=[];renderThumbs();
  inp.value='';inp.style.height='auto';btn.disabled=true;
  ws.send(JSON.stringify({text,images,session:SESSION,show_reasoning:showReasoning}));
}

btn.onclick=send;
inp.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}
});
inp.addEventListener('input',()=>{
  inp.style.height='auto';
  inp.style.height=Math.min(inp.scrollHeight,140)+'px';
});
connect();
</script>
</body>
</html>
