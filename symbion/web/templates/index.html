<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<title>Symbion</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0a0c;--surface:#15151a;--surface-2:#1d1d24;--border:#262630;
  --text:#eaeaf0;--muted:#6a6a78;--muted-2:#9a9aac;
  --sym:#a78bfa;--sym-soft:#a78bfa22;--you:#34d399;--you-soft:#34d39920;
  --accent:#7c3aed;--warn:#f59e0b;--danger:#ef4444;
  --thinking:#15172a;--thinking-border:#2a2d4a;
  --radius:14px;
}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
  font-size:15px;line-height:1.55;
  display:flex;flex-direction:column;
  -webkit-font-smoothing:antialiased;
}

header{
  padding:.6rem 1rem;
  padding-top:max(.6rem,env(safe-area-inset-top));
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:.65rem;flex-shrink:0;
  background:linear-gradient(180deg,var(--bg) 0%,#0a0a0cf2 100%);
  backdrop-filter:blur(6px);
}
.dot{width:7px;height:7px;border-radius:50%;background:#22c55e;flex-shrink:0;box-shadow:0 0 8px #22c55e88}
.dot.dead{background:var(--danger);box-shadow:0 0 8px #ef444488}
.brand{font-size:.95rem;font-weight:700;color:var(--text);letter-spacing:.01em}
.brand .ver{font-size:.7rem;color:var(--muted);font-weight:500;margin-left:.35rem}
#statusbar{
  margin-left:auto;display:flex;gap:.4rem;flex-wrap:nowrap;overflow-x:auto;
  scrollbar-width:none;-ms-overflow-style:none;
}
#statusbar::-webkit-scrollbar{display:none}
.pill{
  display:inline-flex;align-items:center;gap:.3rem;
  font-size:.68rem;color:var(--muted-2);
  background:var(--surface);border:1px solid var(--border);
  padding:.2rem .55rem;border-radius:999px;
  white-space:nowrap;
}
.pill b{color:var(--text);font-weight:600}
.pill.warn{background:#3a2a0033;border-color:#3a2a00;color:var(--warn)}
.pill.warn b{color:var(--warn)}
#st-welfare{display:none}

main{flex:1;overflow:hidden;display:flex;flex-direction:column}
#chat{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:1.5rem 1rem 1rem;
  scroll-behavior:smooth;
}
#chat-inner{
  max-width:760px;margin:0 auto;
  display:flex;flex-direction:column;gap:1.4rem;
}

.msg{animation:fadein .18s ease;word-wrap:break-word}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.msg.you{
  align-self:flex-end;max-width:min(85%,560px);
  background:var(--you-soft);
  border:1px solid #34d39933;
  border-radius:var(--radius) var(--radius) 4px var(--radius);
  padding:.65rem .9rem;color:#a7f3d0;
  font-size:.95rem;line-height:1.5;
  white-space:pre-wrap;word-break:break-word;
}

.msg.sym{align-self:stretch;max-width:100%}
.msg-label{
  font-size:.7rem;font-weight:700;color:var(--sym);
  letter-spacing:.04em;text-transform:uppercase;
  margin-bottom:.35rem;display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;
}
.msg-body{
  white-space:pre-wrap;word-break:break-word;
  color:var(--text);font-size:.95rem;line-height:1.65;
}

.thinking-block{
  background:var(--thinking);border:1px solid var(--thinking-border);
  border-radius:10px;padding:.7rem .9rem;
  font-size:.85rem;color:#a3a8d0;font-style:italic;line-height:1.55;
}
.thinking-label{
  font-size:.65rem;color:#8a8fbb;font-style:normal;font-weight:700;
  text-transform:uppercase;letter-spacing:.06em;margin-bottom:.35rem;
}

.cursor{
  display:inline-block;width:2px;height:1em;background:var(--sym);
  animation:blink .9s step-end infinite;vertical-align:text-bottom;margin-left:1px;
}
@keyframes blink{50%{opacity:0}}

.badge{
  font-size:.6rem;padding:.1rem .45rem;border-radius:4px;font-weight:600;
  text-transform:uppercase;letter-spacing:.03em;
}
.b-rev{background:#1e3a5f44;color:#7dd3fc;border:1px solid #1e3a5f}
.b-warn{background:#3a2a0044;color:var(--warn);border:1px solid #3a2a00}
.b-emotion{background:#1a2a1a44;color:#86efac;border:1px solid #1a2a1a}
.meta{
  font-size:.65rem;color:var(--muted);margin-top:.35rem;
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}

footer{
  padding:.65rem 1rem;
  padding-bottom:max(.65rem,env(safe-area-inset-bottom));
  border-top:1px solid var(--border);
  background:var(--bg);
  display:flex;justify-content:center;flex-shrink:0;
}
.composer{
  width:100%;max-width:760px;
  display:flex;gap:.5rem;align-items:flex-end;
}
#inp{
  flex:1;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:.7rem .95rem;
  color:var(--text);font-size:1rem;font-family:inherit;
  resize:none;outline:none;max-height:140px;
  transition:border-color .15s,background .15s;
  line-height:1.45;
}
#inp::placeholder{color:var(--muted)}
#inp:focus{border-color:var(--accent);background:var(--surface-2)}

.icon-btn,.send-btn{
  border:none;border-radius:var(--radius);
  cursor:pointer;flex-shrink:0;font-weight:600;
  transition:opacity .15s,transform .1s,background .15s;
  font-family:inherit;
}
.icon-btn{
  background:transparent;color:var(--muted);
  border:1px solid var(--border);
  font-size:1rem;width:44px;height:44px;
  display:flex;align-items:center;justify-content:center;
}
.icon-btn.active{color:var(--sym);border-color:var(--sym);background:var(--sym-soft)}
.send-btn{
  background:var(--accent);color:#fff;
  padding:0 1.1rem;height:44px;
  font-size:.92rem;letter-spacing:.02em;
}
.send-btn:disabled{opacity:.35;cursor:not-allowed}

.attach-strip{
  width:100%;max-width:760px;margin:0 auto .4rem;
  display:flex;flex-wrap:wrap;gap:.4rem;
}
.attach-strip:empty{display:none}
.attach-thumb{
  position:relative;width:60px;height:60px;border-radius:8px;
  border:1px solid var(--border);overflow:hidden;background:var(--surface-2);
}
.attach-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.attach-thumb .x{
  position:absolute;top:2px;right:2px;width:18px;height:18px;
  border-radius:50%;background:rgba(0,0,0,.7);color:#fff;
  border:none;font-size:.75rem;cursor:pointer;line-height:1;
  display:flex;align-items:center;justify-content:center;padding:0;
}
.composer.drag-over #inp{border-color:var(--accent);background:var(--surface-2)}
.send-btn:not(:disabled):hover{background:#8b3df0}
.send-btn:not(:disabled):active{transform:scale(.97)}

::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#2c2c38;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#3a3a48}

@media (max-width:540px){
  header{padding:.55rem .75rem;padding-top:max(.55rem,env(safe-area-inset-top))}
  .brand{font-size:.88rem}
  .pill{font-size:.62rem;padding:.18rem .45rem}
  #chat{padding:1rem .75rem .75rem}
  #chat-inner{gap:1.1rem}
  .msg.you{max-width:90%;font-size:.92rem}
  .msg-body{font-size:.92rem}
  footer{padding:.55rem .65rem;padding-bottom:max(.55rem,env(safe-area-inset-bottom))}
  .composer{gap:.4rem}
  #inp{font-size:16px;padding:.6rem .8rem}
  .icon-btn{width:42px;height:42px}
  .send-btn{padding:0 .9rem;height:42px;font-size:.88rem}
}

/* Key entry modal — shown when the WS server requires SYMBION_API_KEY
   auth and the browser has no stored key (or the stored one was wrong). */
.key-modal{
  position:fixed;inset:0;z-index:1000;
  background:rgba(0,0,0,.72);
  display:flex;align-items:center;justify-content:center;
  padding:1rem;padding-top:max(1rem,env(safe-area-inset-top));
  padding-bottom:max(1rem,env(safe-area-inset-bottom));
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
}
.key-modal.hidden{display:none}
.key-modal-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);
  padding:1.4rem;
  max-width:380px;width:100%;
  display:flex;flex-direction:column;gap:.85rem;
}
.key-modal-card h2{font-size:1.05rem;font-weight:700}
.key-modal-sub{font-size:.83rem;color:var(--muted-2);line-height:1.5}
.key-modal-sub code{
  background:var(--surface-2);padding:.1rem .35rem;
  border-radius:4px;font-size:.78rem;
  font-family:ui-monospace,Menlo,Consolas,monospace;
}
.key-modal-card input{
  background:var(--surface-2);border:1px solid var(--border);
  color:var(--text);font-size:16px; /* 16px prevents iOS auto-zoom */
  padding:.7rem .85rem;border-radius:8px;
  -webkit-appearance:none;font-family:ui-monospace,Menlo,Consolas,monospace;
}
.key-modal-card input:focus{outline:none;border-color:var(--sym)}
.key-error{color:var(--danger);font-size:.78rem;min-height:1.1rem;line-height:1.4}
.key-modal-actions{display:flex;justify-content:flex-end;gap:.5rem}
.key-modal-actions .send-btn{height:38px;padding:0 1rem;font-size:.88rem}
.key-modal-actions .ghost-btn{
  background:transparent;border:1px solid var(--border);color:var(--muted-2);
  height:38px;padding:0 .85rem;font-size:.85rem;border-radius:8px;cursor:pointer;
}
.key-modal-hint{font-size:.7rem;color:var(--muted);line-height:1.5}
.key-btn{
  background:transparent;border:1px solid var(--border);color:var(--muted-2);
  font-size:.65rem;padding:.18rem .5rem;border-radius:999px;cursor:pointer;
  flex-shrink:0;
}
.key-btn:hover{color:var(--text);border-color:var(--muted)}
</style>
</head>
<body>
<header>
  <div class="dot" id="dot" aria-label="connection"></div>
  <div class="brand">Symbion<span class="ver">v14</span></div>
  <div id="statusbar">
    <span class="pill">mood <b id="st-mood">--</b></span>
    <span class="pill">sym <b id="st-sym">--</b></span>
    <span class="pill" id="st-dist-pill">dist <b id="st-dist">--</b></span>
    <span class="pill warn" id="st-welfare"><b>! welfare</b></span>
  </div>
  <button id="key-btn" class="key-btn" title="Change or clear API key" aria-label="API key">key</button>
</header>

<div id="key-modal" class="key-modal hidden" role="dialog" aria-modal="true" aria-labelledby="key-modal-title">
  <div class="key-modal-card">
    <h2 id="key-modal-title">Symbion API key</h2>
    <p class="key-modal-sub">This server requires authentication. Enter your <code>SYMBION_API_KEY</code> to continue.</p>
    <input id="key-input" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="API key" />
    <div id="key-error" class="key-error"></div>
    <div class="key-modal-actions">
      <button id="key-clear" class="ghost-btn" type="button">Clear</button>
      <button id="key-submit" class="send-btn" type="button">Connect</button>
    </div>
    <p class="key-modal-hint">Stored locally in this browser (localStorage). Tap <b>key</b> in the header any time to change or clear it.</p>
  </div>
</div>
<main>
  <div id="chat"><div id="chat-inner"></div></div>
</main>
<footer>
  <div id="attach-strip" class="attach-strip"></div>
  <div class="composer">
    <textarea id="inp" rows="1" placeholder="Talk to Symbion... (paste or drop images)" autocomplete="off"></textarea>
    <button id="think-btn" class="icon-btn" title="Toggle reasoning trace" aria-label="Toggle reasoning">?</button>
    <button id="btn" class="send-btn">Send</button>
  </div>
</footer>
<script>
const chat=document.getElementById('chat');
const chatInner=document.getElementById('chat-inner');
const inp=document.getElementById('inp');
const btn=document.getElementById('btn');
const thinkBtn=document.getElementById('think-btn');
// SESSION persists in localStorage so reloading the page continues
// the same conversation. A new session is generated explicitly via
// /new or /quit (the latter also summarises the current one).
const SESSION_STORE='symbion_session';
// Active user persists too — /user lala sets it, ws.onopen re-applies
// it on every reconnect so the server-side per-session user map stays
// in sync with the device's local choice.
const USER_STORE='symbion_user';
function newSessionId(){
  const sid=Math.random().toString(36).slice(2);
  localStorage.setItem(SESSION_STORE,sid);
  return sid;
}
let SESSION=localStorage.getItem(SESSION_STORE)||newSessionId();
let ws, activeMsg=null, activeCursor=null, activeThinking=null, showReasoning=false;

// --- API key handling ----------------------------------------------------
// SYMBION_API_KEY is required when the server has one configured. We store
// the user's key in localStorage and send {type:'auth',key:...} as the
// first WS frame. If the server reports unauthorized / auth timeout /
// invalid auth frame, we clear the stored key and show the modal.
const KEY_STORE='symbion_api_key';
let apiKey=localStorage.getItem(KEY_STORE)||'';
let suppressReconnect=false; // set true on auth-class close so we don't loop

const keyModal=document.getElementById('key-modal');
const keyInput=document.getElementById('key-input');
const keyError=document.getElementById('key-error');
const keySubmit=document.getElementById('key-submit');
const keyClear=document.getElementById('key-clear');
const keyBtn=document.getElementById('key-btn');

function showKeyModal(errMsg){
  keyError.textContent=errMsg||'';
  keyInput.value=apiKey||'';
  keyModal.classList.remove('hidden');
  // Slight delay so iOS can focus the input after the modal paints
  setTimeout(()=>{try{keyInput.focus();keyInput.select();}catch(e){}},50);
}
function hideKeyModal(){keyModal.classList.add('hidden');keyError.textContent=''}

keyBtn.onclick=()=>showKeyModal('');
keyClear.onclick=()=>{
  localStorage.removeItem(KEY_STORE);
  apiKey='';
  keyInput.value='';
  keyError.textContent='Key cleared. Enter a new one or tap Connect to try without a key (works on no-auth servers).';
};
keySubmit.onclick=()=>{
  const v=keyInput.value.trim();
  apiKey=v;
  if(v) localStorage.setItem(KEY_STORE,v);
  else localStorage.removeItem(KEY_STORE);
  hideKeyModal();
  // Force a fresh connection so the new key gets sent as the auth frame
  suppressReconnect=false;
  try{if(ws&&ws.readyState<2) ws.close();}catch(e){}
  setTimeout(connect,200);
};
keyInput.addEventListener('keydown',e=>{if(e.key==='Enter') keySubmit.click()});

function nearBottom(){return chat.scrollHeight-chat.scrollTop-chat.clientHeight<80}
function scrollToBottom(force){if(force||nearBottom())chat.scrollTop=chat.scrollHeight}

thinkBtn.onclick=()=>{
  showReasoning=!showReasoning;
  thinkBtn.classList.toggle('active',showReasoning);
  if(ws&&ws.readyState===1) ws.send(JSON.stringify({type:'toggle_reasoning',value:showReasoning}));
};

function connect(){
  const proto=location.protocol==='https:'?'wss':'ws';
  ws=new WebSocket(`${proto}://${location.host}/ws/${SESSION}`);
  ws.onopen=()=>{
    document.getElementById('dot').classList.remove('dead');
    // Send the auth frame as the first message if we have a key. The
    // server treats this frame as required when SYMBION_API_KEY is set
    // and ignores it harmlessly when the server has no key configured,
    // so it's safe to always send it (the server's main loop drops
    // unknown type:'auth' frames). If we have no key stored, send
    // nothing — let the server tell us whether it needs one.
    if(apiKey){
      try{ws.send(JSON.stringify({type:'auth',key:apiKey}));}catch(e){}
    }
    // If a non-default user is stored from a prior /user command, set it
    // on the new session so the server attributes messages correctly.
    // No-op when no user is stored (server defaults to cfg.active_user).
    const storedUser = localStorage.getItem(USER_STORE);
    if(storedUser && storedUser !== 'aaron'){
      try{ws.send(JSON.stringify({type:'set_user', name:storedUser}));}catch(e){}
    }
  };
  ws.onclose=()=>{
    document.getElementById('dot').classList.add('dead');
    if(suppressReconnect){
      // Last close was auth-related — don't auto-reconnect, the user
      // needs to fix the key first via the modal.
      return;
    }
    setTimeout(connect,3000);
  };
  ws.onmessage=e=>{
    const d=JSON.parse(e.data);
    // Any non-error frame from the server means we're connected and
    // authorized — auto-hide the key modal if it's open. Covers both
    // the with-key-server case (auth_ok comes first) and the no-key-
    // server case (status frame comes first, no auth_ok involved).
    if(d.t!=='error' && !keyModal.classList.contains('hidden')){
      hideKeyModal();
    }
    if(d.t==='tok'){
      if(!activeMsg) startMsg();
      appendTok(d.v);
    } else if(d.t==='thinking_tok'){
      if(!activeThinking) startThinking();
      appendThinkingTok(d.v);
    } else if(d.t==='thinking_end'){
      endThinking();
    } else if(d.t==='revise'){
      if(activeCursor) activeCursor.remove();
      if(activeMsg){
        activeMsg.querySelector('.msg-body').textContent='';
        activeCursor=document.createElement('span');
        activeCursor.className='cursor';
        activeMsg.querySelector('.msg-body').appendChild(activeCursor);
      }
    } else if(d.t==='done'){
      finishMsg(d.meta,d.badges,d.emotion);
      updateStatus(d.status);
      btn.disabled=false;
    } else if(d.t==='status'){
      updateStatus(d);
    } else if(d.t==='auth_ok'){
      // Server confirmed our auth frame. The status frame that follows
      // will populate the header pills.
    } else if(d.t==='cmd_result'){
      // Server-dispatched slash-command response. Render as a styled
      // Symbion message so it looks like a system reply, not a chat turn.
      const lines = d.lines || [];
      addSymStatic(lines.join('\n'));
    } else if(d.t==='history'){
      renderHistory(d.messages||[]);
    } else if(d.t==='summarize_ok'){
      // Session was flushed to a summary server-side. Start a fresh
      // conversation: clear the chat, generate a new SESSION, reconnect.
      // Cross-session memory will surface the just-written summary as
      // needed via retrieval — nothing is lost.
      const count=d.count||0;
      const note=document.createElement('div');
      note.className='msg sym';
      note.innerHTML='<div class="msg-label">Symbion</div><div class="msg-body"></div>';
      note.querySelector('.msg-body').textContent=`Session summarised (${count} msg${count===1?'':'s'} folded into long-term memory). Starting fresh.`;
      chatInner.appendChild(note);
      scrollToBottom(true);
      setTimeout(()=>{
        SESSION=newSessionId();
        chatInner.innerHTML='';
        suppressReconnect=false;
        try{ws.close();}catch(e){}
        setTimeout(connect,200);
      },900);
    } else if(d.t==='error'){
      const msg=String(d.v||'');
      const isAuthErr=msg==='unauthorized'||msg==='auth timeout'||msg==='invalid auth frame';
      if(isAuthErr){
        // The stored key was wrong, missing, or expired. Block
        // auto-reconnect (would just fail again) and prompt the user.
        suppressReconnect=true;
        const prettyMsg=msg==='unauthorized'?'Wrong API key — try again.'
                       :msg==='auth timeout'?'Server timed out waiting for an auth frame. The key field above sends one.'
                       :'The browser sent a malformed auth frame. Try again.';
        showKeyModal(prettyMsg);
      } else {
        // Non-auth error (e.g. rate limit) — surface inline if we have
        // an active message context, otherwise drop on the floor.
        if(activeMsg) appendTok(`[error: ${msg}]`);
      }
    }
  };
}

function updateStatus(s){
  if(!s)return;
  if(s.mood) document.getElementById('st-mood').textContent=s.mood;
  if(s.sym)  document.getElementById('st-sym').textContent=s.sym;
  const de=document.getElementById('st-dist');
  if(s.dist!==undefined){
    de.textContent=s.dist||'--';
    document.getElementById('st-dist-pill').classList.toggle('warn',parseFloat(s.dist||0)>0.5);
  }
  document.getElementById('st-welfare').style.display=
    (s.welfare&&s.welfare!=='null'&&s.welfare!=='None')?'':'none';
}

function startMsg(){
  activeMsg=document.createElement('div');
  activeMsg.className='msg sym';
  activeMsg.innerHTML='<div class="msg-label">Symbion</div><div class="msg-body"></div>';
  activeCursor=document.createElement('span');
  activeCursor.className='cursor';
  activeMsg.querySelector('.msg-body').appendChild(activeCursor);
  chatInner.appendChild(activeMsg);
  scrollToBottom(true);
}

function startThinking(){
  const wrap=document.createElement('div');
  wrap.className='msg sym';
  const block=document.createElement('div');
  block.className='thinking-block';
  block.innerHTML='<div class="thinking-label">Thinking</div>';
  activeThinking=document.createElement('div');
  activeThinking.style.whiteSpace='pre-wrap';
  block.appendChild(activeThinking);
  wrap.appendChild(block);
  chatInner.appendChild(wrap);
  scrollToBottom(true);
}

function appendThinkingTok(tok){
  if(activeThinking){activeThinking.textContent+=tok;scrollToBottom()}
}
function endThinking(){activeThinking=null}

function appendTok(tok){
  if(!activeMsg)return;
  const body=activeMsg.querySelector('.msg-body');
  body.insertBefore(document.createTextNode(tok),activeCursor);
  scrollToBottom();
}

function finishMsg(meta,badges,emotion){
  if(activeCursor){activeCursor.remove();activeCursor=null}
  if(activeMsg&&badges&&badges.length){
    const label=activeMsg.querySelector('.msg-label');
    badges.forEach(b=>{
      const s=document.createElement('span');
      s.className='badge b-'+b.cls;s.textContent=b.label;
      label.appendChild(s);
    });
  }
  if(emotion&&emotion!=='neutral'&&emotion!==''&&activeMsg){
    const label=activeMsg.querySelector('.msg-label');
    const s=document.createElement('span');
    s.className='badge b-emotion';s.textContent=emotion;
    label.appendChild(s);
  }
  if(meta&&activeMsg){
    const m=document.createElement('div');
    m.className='meta';m.textContent=meta;
    activeMsg.appendChild(m);
  }
  activeMsg=null;
  scrollToBottom();
}

function addYou(text){
  const d=document.createElement('div');
  d.className='msg you';d.textContent=text;
  chatInner.appendChild(d);
  scrollToBottom(true);
}

// Render a completed assistant message into the chat scroll (no cursor,
// no streaming animation). Used by the history-replay path on connect.
function addSymStatic(text){
  const d=document.createElement('div');
  d.className='msg sym';
  d.innerHTML='<div class="msg-label">Symbion</div><div class="msg-body"></div>';
  d.querySelector('.msg-body').textContent=text;
  chatInner.appendChild(d);
}

// Render the server's {t:'history',messages:[...]} payload. role==='user'
// goes via addYou; role==='assistant' via addSymStatic. Messages arrive
// in chronological order (memory.get_recent returns them reversed).
function renderHistory(messages){
  if(!messages||!messages.length) return;
  chatInner.innerHTML='';
  for(const m of messages){
    if(m.role==='user')           addYou(m.content);
    else if(m.role==='assistant') addSymStatic(m.content);
  }
  scrollToBottom(true);
}

// === Image attachments ===
const attachStrip=document.getElementById('attach-strip');
const composer=document.querySelector('.composer');
const MAX_IMAGES=6, MAX_BYTES=10*1024*1024;
let pending=[];

function renderThumbs(){
  attachStrip.innerHTML='';
  pending.forEach((du,i)=>{
    const t=document.createElement('div');t.className='attach-thumb';
    const img=document.createElement('img');img.src=du;t.appendChild(img);
    const x=document.createElement('button');x.className='x';x.textContent='x';
    x.onclick=()=>{pending.splice(i,1);renderThumbs()};
    t.appendChild(x);attachStrip.appendChild(t);
  });
}
function addFile(f){
  if(!f||!f.type||!f.type.startsWith('image/'))return;
  if(f.size>MAX_BYTES){console.warn('image too large, skipping');return}
  if(pending.length>=MAX_IMAGES)return;
  const r=new FileReader();
  r.onload=()=>{pending.push(r.result);renderThumbs()};
  r.readAsDataURL(f);
}

inp.addEventListener('paste',e=>{
  const items=e.clipboardData&&e.clipboardData.items;
  if(!items)return;
  for(const it of items){
    if(it.kind==='file'){const f=it.getAsFile();if(f)addFile(f)}
  }
});
['dragenter','dragover'].forEach(ev=>composer.addEventListener(ev,e=>{
  e.preventDefault();composer.classList.add('drag-over');
}));
['dragleave','drop'].forEach(ev=>composer.addEventListener(ev,e=>{
  e.preventDefault();composer.classList.remove('drag-over');
}));
composer.addEventListener('drop',e=>{
  const files=e.dataTransfer&&e.dataTransfer.files;
  if(!files)return;
  for(const f of files) addFile(f);
});

// Slash commands handled client-side. Match the terminal's idioms so
// /quit etc. do what they do in the REPL rather than being sent as
// chat messages. Returning true means "handled, don't fall through to
// the normal send path."
function handleSlashCommand(text){
  const cmd=text.toLowerCase();
  if(cmd==='/quit'||cmd==='/end'){
    if(!ws||ws.readyState!==1){
      addSymStatic('Not connected — can’t summarise. Try again when the dot turns green.');
      return true;
    }
    ws.send(JSON.stringify({type:'summarize'}));
    // The server replies with {t:'summarize_ok'} which clears the chat
    // and starts a new session; nothing else for us to do here.
    return true;
  }
  if(cmd==='/new'){
    SESSION=newSessionId();
    chatInner.innerHTML='';
    suppressReconnect=false;
    try{if(ws)ws.close();}catch(e){}
    setTimeout(connect,200);
    return true;
  }
  if(cmd==='/key'){
    showKeyModal('');
    return true;
  }
  if(cmd==='/think'){
    // Mirror the terminal /think toggle. The think button in the header
    // wires the same WS frame, so this just stays in sync with that path.
    showReasoning = !showReasoning;
    thinkBtn.classList.toggle('active', showReasoning);
    if(ws && ws.readyState === 1){
      ws.send(JSON.stringify({type:'toggle_reasoning', value:showReasoning}));
    }
    addSymStatic(`Chain-of-thought: ${showReasoning ? 'ON' : 'OFF'}`);
    return true;
  }
  // Server-side commands: send a {type:'cmd',cmd:...} frame, the server
  // dispatches via symbion.web_command and replies with {t:'cmd_result',
  // lines:[...]} which the onmessage handler renders below.
  const SERVER_CMDS = ['/whoami','/status','/mood','/welfare','/profile','/memory','/tasks','/identity','/gaps','/tools','/escalate','/forget','/summarize'];
  if(SERVER_CMDS.includes(cmd)){
    if(ws && ws.readyState === 1){
      ws.send(JSON.stringify({type:'cmd', cmd:cmd}));
    } else {
      addSymStatic('Not connected. Wait for the dot to turn green.');
    }
    return true;
  }
  if(cmd.startsWith('/user')){
    // /user           -> show current active user (from localStorage)
    // /user <name>    -> switch to <name>: store in localStorage and tell
    //                    the server. SAME SESSION continues — shared
    //                    memory pool stays visible, chat scroll stays
    //                    intact. Only future writes get tagged with the
    //                    new user; the profile lookup gets the per-user
    //                    overlay on top of the shared base.
    const parts = text.split(/\s+/);
    if(parts.length < 2 || !parts[1]){
      const cur = localStorage.getItem(USER_STORE) || 'aaron';
      addSymStatic(`Active user: ${cur}. Switch with /user <name> (e.g. /user lala).`);
      return true;
    }
    const name = parts[1].toLowerCase().replace(/[^a-z0-9_-]/g, '').slice(0, 32);
    if(!name){
      addSymStatic('Invalid user name. Use letters/digits/_/- only.');
      return true;
    }
    const prior = localStorage.getItem(USER_STORE) || 'aaron';
    localStorage.setItem(USER_STORE, name);
    if(ws && ws.readyState === 1){
      ws.send(JSON.stringify({type:'set_user', name:name}));
    }
    addSymStatic(`Active user: ${prior} → ${name}. Shared memory still visible. New entries tagged as ${name}.`);
    return true;
  }
  if(cmd==='/help'){
    addSymStatic([
      'Slash commands:',
      '  /quit, /end          save & end session, start fresh',
      '  /new                 start fresh session (no save)',
      '  /user [<name>]       show or switch active user (e.g. /user lala)',
      '  /key                 open API key modal',
      '  /think               toggle chain-of-thought display',
      '  /whoami              Symbion self-description',
      '  /status              health metrics snapshot',
      '  /mood                current mood label',
      '  /welfare             distress / failure / over-caution stats',
      '  /profile             your profile facts (per-user)',
      '  /memory              recent messages across sessions',
      '  /tasks               active tasks',
      '  /identity            recent formative moments',
      '  /gaps                open knowledge gaps',
      '  /tools               list built-in tools',
      '  /escalate            force the NEXT turn to use Opus 4.7',
      '  /forget              clear THIS session memory',
      '  /help                this list'
    ].join('\n'));
    return true;
  }
  return false;
}

function send(){
  const text=inp.value.trim();
  if((!text&&!pending.length)||!ws||ws.readyState!==1)return;
  // Slash-command path: consume the input without sending to the server
  // (except /quit which sends a control frame, not a chat message).
  if(text.startsWith('/')&&!pending.length&&handleSlashCommand(text)){
    inp.value='';inp.style.height='auto';
    return;
  }
  const display=text+(pending.length?` [+${pending.length} image${pending.length>1?'s':''}]`:'');
  addYou(display);
  const images=pending.slice();
  pending=[];renderThumbs();
  inp.value='';inp.style.height='auto';btn.disabled=true;
  ws.send(JSON.stringify({text,images,session:SESSION,show_reasoning:showReasoning}));
}

btn.onclick=send;
inp.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}
});
inp.addEventListener('input',()=>{
  inp.style.height='auto';
  inp.style.height=Math.min(inp.scrollHeight,140)+'px';
});
// Show the key modal up-front if we have no stored key. We still kick
// off connect() in parallel — on a no-auth server the first status
// frame will auto-dismiss the modal without the user having to do
// anything. On an auth-required server the modal stays put until the
// user enters a key.
if(!apiKey){
  showKeyModal('Enter your server’s SYMBION_API_KEY, or tap Connect without one if the server doesn’t require auth.');
}
connect();
</script>
